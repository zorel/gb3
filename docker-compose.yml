version: "3"
 
services:
 gb0:
  build:
   context: .
   dockerfile: gb0.Dockerfile
  ports:
   - "16667:16667"
  volumes:
   - gb0-data:/data
 gb2c:
  build:
   context: .
   dockerfile: gb2c.Dockerfile
  depends_on:
   - gb0
  environment:
   - "GB2C_GB0_TRIBUNES=taiste:http://gb0:16667"
#   - "GB2C_STORE=sqlite"
#   - "GB2C_SQLITE_MAX_POSTS_IN_STORAGE=0"
  ports:
   - "16666:16666"
  volumes:
   - gb2c-attachments:/data/attachments
   - gb2c-posts:/data/posts
 reverse-proxy:
  image: docker.io/nginx
  depends_on:
   - gb0
   - gb2c
  volumes:
   - ./nginx.conf:/etc/nginx/conf.d/default.conf
   - ./gc2:/srv/gc2
  ports:
   - "8080:80"

volumes:
  gb0-data: ~
  gb2c-attachments: ~
  gb2c-posts: ~

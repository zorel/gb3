<!doctype html>
<html>
    <head>
        <meta charset="UTF-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content"
        />
        <meta name="robots" content="noindex,nofollow" />
        <title>gb3 settings</title>
        <link rel="stylesheet" href="css/gc2-settings.css?v=20261024" />
    </head>

    <body>
        <main>
            <section>
                <h2>Identity</h2>
                <label for="nickname">Nickname:</label>
                <input id="nickname" type="text" />
                <label>Connect with:</label>
                <a href="/gb2c/linuxfr/authorize">linuxfr</a>
            </section>
            <section>
                <h2>Interface:</h2>
                <label for="tribunes">Tribunes:</label>
                <select id="tribunes" multiple size="8"></select>
                <label for="plopList">Plop list (comma separated):</label>
                <input id="plopList" type="text" placeholder="e.g. alice,bob" />
                <label for="blockedIdentities"
                    >Hide conversations from login/UA (comma separated):</label
                >
                <input
                    id="blockedIdentities"
                    type="text"
                    placeholder="e.g. alice,Some bot UA"
                />
                <label for="blockedDisplayMode">Filtered conversations:</label>
                <select id="blockedDisplayMode">
                    <option value="hide">Hide posts</option>
                    <option value="gray">Gray posts and hide messages</option>
                </select>
            </section>
            <section>
                <h2>Coin ! Coin!</h2>
                <button id="backButton">Back</button>
            </section>
        </main>
        <script
            src="js/gc2-settings.js?v=20261024"
            type="module"
            defer
        ></script>
    </body>
</html>

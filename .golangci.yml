version: "2"

formatters:
  enable:
    - gofumpt

linters:
  default: none
  enable:
    - errcheck
    - bodyclose
    - copyloopvar
    - dupl
    - govet
    - ineffassign
    - misspell
    - revive
    - staticcheck
    - unused

  settings:
    errcheck:
      check-type-assertions: false
      check-blank: false
      exclude-functions:
        - (net/http.ResponseWriter).Write
        - (io.ReadCloser).Close
        - (mime/multipart.File).Close
        - (*os.Root).Close

    revive:
      severity: warning
      rules:
        - name: blank-imports
        - name: comment-spacings
        - name: context-as-argument
        - name: context-keys-type
        - name: defer
        - name: dot-imports
        - name: empty-block
        - name: error-naming
        - name: error-return
        - name: error-strings
        - name: errorf
        - name: exported
        - name: if-return
        - name: increment-decrement
        - name: indent-error-flow
        - name: range
        - name: receiver-naming
        - name: redefines-builtin-id
        - name: superfluous-else
        - name: time-naming
        - name: unexported-return
        - name: unreachable-code
        - name: unused-parameter
        - name: var-declaration
        - name: var-naming
